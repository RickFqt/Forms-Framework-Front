<body>
    <div class="container">
        <!-- Seção esquerda com logo e texto -->
        <div class="left-section">
            <div class="logo">
                <img src="DASH_logo.png" alt="Logo GRAB" style="width : 60%;">
                <h1 class="title">GRAB</h1>
            </div>
            <h2 class="slogan">Construa seus editais de forma eficaz</h2>
            <p class="description">Melhore seus processos seletivos com sugestões de IA</p>
        </div>
        
        <!-- Seção direita com imagem e botão -->
        <div class="right-section">
            <div class="right">
            <img src="Smart-People-2--Streamline-Milano.png" alt="Imagem ilustrativa" class="main-image">
                <!-- <a [routerLink]="['/login']"> -->
                <!-- TODO: CHANGE THIS!! -->
                <a [routerLink]="['/home']">
                    <img 
                        [src]="buttonSrc" 
                        alt="Botão" 
                        class="button" 
                        (mouseenter)="onHoverButton()"
                        (mouseleave)="onLeaveButton()">
                </a>
            </div>
        </div>
    </div>
</body>
